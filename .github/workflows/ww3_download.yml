name: Download and Convert WW3 Data

on:
  # Run every 6 hours (aligns with WW3 model runs at 00, 06, 12, 18 UTC)
  schedule:
    - cron: '30 0,6,12,18 * * *'  # 30 minutes after each model run

  # Allow manual triggering
  workflow_dispatch:

  # Run on pushes to the claude branch (for testing)
  push:
    branches:
      - 'claude/wave-watch-data-pipeline-*'

jobs:
  download-and-convert:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies (eccodes for GRIB2)
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev libeccodes-tools

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run WW3 download and conversion
        run: |
          # Download 5-day forecast at hourly resolution (121 timesteps)
          # This is optimized for GitHub Actions memory limits (~7GB)
          export WW3_FORECAST_HOURS="0-120"

          # Alternative configurations (uncomment to use):
          # export WW3_FORECAST_HOURS="0"  # Analysis only (smallest, ~18MB)
          # export WW3_FORECAST_HOURS="0-48"  # 2-day hourly forecast (~500MB)
          # export WW3_FORECAST_HOURS="0-120,123-384:3"  # Full 16-day forecast (large, may OOM)
          python download_ww3.py

      - name: Check Zarr data size
        run: |
          if [ -d "data/zarr" ]; then
            echo "Zarr data directory size:"
            du -sh data/zarr/
            echo ""
            echo "Zarr files:"
            ls -lh data/zarr/
          else
            echo "No Zarr data found!"
            exit 1
          fi

      - name: Clean up GRIB files
        run: |
          # Remove any remaining GRIB files to save disk space
          if [ -d "data/grib" ]; then
            echo "Cleaning up GRIB directory..."
            rm -rf data/grib/*
            echo "GRIB cleanup complete"
          fi

      - name: Cleanup old Zarr datasets (keep only latest)
        run: |
          cd data/zarr

          # List all zarr directories sorted by modification time (newest first)
          # Exclude the 'latest.zarr' symlink
          zarr_dirs=$(ls -dt *.zarr 2>/dev/null | grep -v "^latest.zarr$" || true)

          # Count total zarr directories
          total=$(echo "$zarr_dirs" | grep -v '^$' | wc -l)

          echo "Found $total Zarr dataset(s)"

          if [ "$total" -gt 1 ]; then
            # Keep only the most recent, delete the rest
            to_delete=$((total - 1))
            echo "Keeping only the latest dataset, removing $to_delete old dataset(s)..."

            echo "$zarr_dirs" | tail -n "$to_delete" | while read dir; do
              if [ -d "$dir" ]; then
                echo "Removing old dataset: $dir"
                rm -rf "$dir"
              fi
            done

            echo ""
            echo "Remaining Zarr dataset:"
            ls -lht *.zarr 2>/dev/null | grep -v "^l" || true
          else
            echo "Only $total dataset(s) present, no cleanup needed"
          fi

      - name: Extract web-friendly data for GitHub Pages
        run: |
          echo "Extracting web data from Zarr..."
          # Find the latest zarr directory (excluding symlink)
          latest_zarr=$(ls -dt data/zarr/*.zarr 2>/dev/null | grep -v "latest.zarr" | head -n 1)

          if [ -n "$latest_zarr" ]; then
            echo "Processing: $latest_zarr"
            python extract_web_data.py "$latest_zarr" docs/data
            echo ""
            echo "Web data files:"
            ls -lh docs/data/
          else
            echo "Error: No Zarr dataset found"
            exit 1
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Upload Zarr dataset as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ww3-zarr-latest
          path: data/zarr/*.zarr
          retention-days: 14
          compression-level: 0  # Zarr is already compressed

      - name: Upload workflow summary
        if: always()
        run: |
          echo "## WAVE WATCH 3 Data Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Run Time:** $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${GITHUB_REF_NAME}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -d "data/zarr" ]; then
            echo "### Zarr Data" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            ls -lh data/zarr/ 2>/dev/null || echo "No files found"
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Total Size:** $(du -sh data/zarr/ 2>/dev/null | cut -f1 || echo 'N/A')" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ No Zarr data directory found" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### GitHub Pages" >> $GITHUB_STEP_SUMMARY
          echo "**Visualization:** https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -d "docs/data" ]; then
            echo "### Web Data" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            ls -lh docs/data/ 2>/dev/null || echo "No files found"
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi
